<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Todo List App</h1>
        <!-- Add Todo -->
        <div class="add-section">
            <label for="todoInput">Add Item</label>
            <input
                type="text"
                id="todoInput"
                class="todo-input"
            >
            <div class="buttons">
                <button id="addBtn" class="add-btn">
                    Add To List
                </button>
                <button id="clearBtn" class="clear-btn">
                    Clear Todo List
                </button>
            </div>
        </div>
        <!-- Todo List -->
        <h2>Todo List</h2>
        <div class="todo-list">
            
            
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
